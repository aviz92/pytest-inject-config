[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-inject-config"
version = "1.0.0"
description = "A pytest plugin that loads a JSON or YAML file given by --config-path and injects it into test classes as self.config."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Avi Zaguri" },]

keywords = [
    "pytest",
    "plugin",
    "testing",
    "config",
    "configuration",
    "json",
    "yaml",
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "python-base-command>=0.1.8",
    "pre-commit>=4.7.0",
    "setuptools>=84.0.0",
    "wheel>=0.45.1",
]

[project.urls]
Homepage = "https://github.com/aviz92/pytest-inject-config"
Repository = "https://github.com/aviz92/pytest-inject-config"
Issues = "https://github.com/aviz92/pytest-inject-config/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["pytest_inject_config*"]
namespaces = false

[project.entry-points.pytest11]
inject_config = "pytest_inject_config.plugin"
